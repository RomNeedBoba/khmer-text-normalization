[project]
name = "khmer-tn"
version = "0.1.0"
description = "Hybrid tag-and-verbalize text normalization for Khmer text-to-speech"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
ner = ["spacy>=3.8"]
segment = ["khmercut"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["khmer_tn"]
